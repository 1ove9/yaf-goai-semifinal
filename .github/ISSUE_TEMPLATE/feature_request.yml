name: 💡 Feature request
description: Suggest an idea (提出新功能建议)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the antenna-design workflow pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which roadmap phase does this belong to?
      description: See docs/next-steps.md
      options:
        - "Phase A — real solvers & known-answer tests"
        - "Phase B — physics-grounded AI"
        - "Phase C — manufacturing"
        - "Phase D — platform/frontend/observability"
        - "Phase E — invention benchmarks"
        - "Other / not sure"
